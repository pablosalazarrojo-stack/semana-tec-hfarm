<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Barlow+Condensed:wght@800&family=Newsreader:ital,wght@1,400&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #F1EEE8; font-family: Archivo, Arial, sans-serif; color: #101216; }
  .card { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 700px 500px; }
  .left { padding: 52px 48px 44px 60px; display: flex; flex-direction: column; gap: 22px; }
  .top { display: flex; align-items: center; gap: 18px; }
  .top img { height: 104px; mix-blend-mode: multiply; }
  .eyebrow { font-size: 19px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; }
  .sq { display: inline-block; width: 14px; height: 14px; background: #FF5B1A; margin-right: 12px; vertical-align: 1px; }
  h1 { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; text-transform: uppercase; font-size: 70px; line-height: 0.93; }
  h1 span { color: #B83A0B; }
  .date { margin-top: auto; display: flex; align-items: stretch; gap: 0; }
  .date .d { background: #101216; color: #F1EEE8; padding: 16px 22px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 46px; line-height: 1; text-transform: uppercase; }
  .date .d b { color: #FF5B1A; }
  .date .p { background: #FF5B1A; color: #101216; padding: 16px 20px; font-weight: 700; font-size: 20px; display: flex; flex-direction: column; justify-content: center; line-height: 1.25; }
  .right { position: relative; }
  .right img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .right .tag { position: absolute; left: 0; bottom: 0; background: #101216; color: #F1EEE8; font-size: 18px; padding: 12px 16px; }
  .right .tag i { font-family: Newsreader, Georgia, serif; }
</style></head>
<body>
<div class="card">
  <div class="left">
    <div class="top"><img src="../img/hfarm-logo.png" alt=""><p class="eyebrow"><span class="sq"></span>Semana Tec Internacional</p></div>
    <h1>Vivencia única de emprendimiento e innovación, <span>junto a Venecia</span></h1>
    <div class="date"><p class="d">Mayo <b>1 al 8</b> · 2027</p><p class="p">Roncade (Treviso),<br>Italia</p></div>
  </div>
  <div class="right">
    <img src="../img/venecia1.jpg" alt="">
    <p class="tag">Tecnológico de Monterrey · <i>Escuela de Negocios</i></p>
  </div>
</div>
</body></html>
